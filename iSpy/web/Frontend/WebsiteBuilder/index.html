<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>iSpy AI Website Builder</title>


<!-- GrapesJS -->
<link rel="stylesheet" href="https://unpkg.com/grapesjs@0.22.8/dist/css/grapes.min.css">

<script src="https://unpkg.com/grapesjs@0.22.8"></script>


<!-- GrapesJS Preset -->
<script src="https://unpkg.com/grapesjs-preset-webpage@1.0.3"></script>


<style>

html, body {
    margin:0;
    height:100%;
    overflow:hidden;
}


#gjs {
    height:100vh;
}


/* Better block appearance */

.gjs-block {
    width:120px;
    min-height:90px;
}


</style>


</head>


<body>


<div id="gjs">

<section style="
padding:80px;
background:#0b1120;
color:white;
text-align:center;
">

<h1>
Welcome to iSpy AI
</h1>

<p>
Build professional AI and robotics websites.
</p>

</section>


</div>





<script>


const editor = grapesjs.init({

    container:"#gjs",

    height:"100vh",


    storageManager:{
        type:"local",
        autosave:true,
        autoload:true
    },


    plugins:[
        "grapesjs-preset-webpage"
    ],


    pluginsOpts:{

        "grapesjs-preset-webpage":{

            blocksBasicOpts:{
                blocks:[
                    "column1",
                    "column2",
                    "text",
                    "image",
                    "video"
                ]
            }

        }

    }


});






const bm = editor.BlockManager;




// =========================
// HERO BLOCK
// =========================


bm.add("ai-hero",{


label:"AI Hero",

category:"iSpy AI",


content:`

<section style="
padding:100px;
background:
linear-gradient(135deg,#020617,#1e3a8a);
color:white;
text-align:center;
">


<h1 style="
font-size:64px;
margin-bottom:20px;
">

AI Vision Platform

</h1>


<p style="
font-size:24px;
opacity:.8;
">

Computer vision technology for robotics,
drones, and automation.

</p>


<button style="
margin-top:30px;
padding:16px 40px;
font-size:18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
">

Explore Technology

</button>


</section>

`

});





// =========================
// FEATURE GRID
// =========================


bm.add("feature-grid",{


label:"Feature Grid",

category:"iSpy AI",


content:`

<section style="
padding:70px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
background:#f8fafc;
">


<div style="
padding:30px;
border-radius:20px;
background:white;
box-shadow:0 10px 30px #0002;
">

<h2>
Computer Vision
</h2>

<p>
Real-time object detection and tracking.
</p>

</div>



<div style="
padding:30px;
border-radius:20px;
background:white;
box-shadow:0 10px 30px #0002;
">

<h2>
Robotics
</h2>

<p>
Autonomous systems powered by AI.
</p>

</div>



<div style="
padding:30px;
border-radius:20px;
background:white;
box-shadow:0 10px 30px #0002;
">

<h2>
Analytics
</h2>

<p>
Understand your data instantly.
</p>

</div>



</section>

`

});







// =========================
// AI DASHBOARD
// =========================


bm.add("ai-dashboard",{


label:"AI Dashboard",

category:"iSpy AI",


content:`

<section style="
padding:50px;
background:#111827;
color:white;
border-radius:20px;
">


<h2>
Model Performance
</h2>


<div style="
display:flex;
gap:40px;
margin-top:30px;
">


<div>
<h1>
98.7%
</h1>
Accuracy
</div>


<div>
<h1>
120 FPS
</h1>
Inference
</div>


<div>
<h1>
42
</h1>
Objects
</div>


</div>


</section>

`

});






// =========================
// CAMERA FEED
// =========================


bm.add("camera-feed",{


label:"Camera Feed",

category:"Robotics",


content:`

<div style="
padding:40px;
background:#020617;
color:white;
border-radius:20px;
">


<h2>
Live Camera Feed
</h2>


<div style="
height:300px;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
">

CAMERA VIEW

</div>


</div>

`

});







// =========================
// ROBOT STATUS
// =========================


bm.add("robot-status",{


label:"Robot Telemetry",

category:"Robotics",


content:`

<div style="
padding:40px;
background:#0f172a;
color:white;
border-radius:20px;
">


<h2>
Robot Status
</h2>


<p>
Battery: 87%
</p>


<p>
Motors: Online
</p>


<p>
Sensors: Active
</p>


</div>

`

});







// =========================
// PRICING
// =========================


bm.add("pricing",{


label:"Pricing",

category:"Business",


content:`

<section style="
padding:70px;
text-align:center;
">


<h1>
Simple Pricing
</h1>


<div style="
display:flex;
justify-content:center;
gap:30px;
">


<div style="
padding:40px;
border-radius:20px;
background:#f1f5f9;
">

<h2>
Starter
</h2>

<h1>
$49
</h1>

</div>



<div style="
padding:40px;
border-radius:20px;
background:#dbeafe;
">

<h2>
Enterprise
</h2>

<h1>
$499
</h1>

</div>



</div>


</section>

`

});






// =========================
// FOOTER
// =========================


bm.add("footer",{


label:"Footer",

category:"Business",


content:`

<footer style="
padding:50px;
background:#020617;
color:white;
text-align:center;
">


<h2>
iSpy AI
</h2>


<p>
Building the future of computer vision.
</p>


</footer>

`

});



</script>


</body>
</html>
