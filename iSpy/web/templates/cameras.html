{% extends "base.html" %}
{% block title %}Cameras - iSpy{% endblock %}
{% block content %}
<h1>Cameras</h1>
<div id="camera-controls" class="card controls-bar">
  <label class="controls-label">
    Refresh interval
    <select id="refresh-rate" onchange="setRefreshRate()">
      <option value="500">500ms</option>
      <option value="1000" selected>1s</option>
      <option value="2000">2s</option>
      <option value="5000">5s</option>
    </select>
  </label>
  <button onclick="refreshCameras()" class="btn-refresh">Refresh</button>
  <button onclick="openAddCameraModal()" class="btn-ok" style="margin-left:auto;">+ Add Camera</button>
</div>
<div id="camera-grid" class="grid"></div>

<div id="add-camera-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeAddCameraModal()">
  <div class="modal" style="max-width:520px;">
    <h3>Add Camera</h3>
    <div class="settings-section">
      <div class="form-row">
        <span class="form-label">Device</span>
        <select id="new-cam-device" class="form-input" onchange="onDeviceSelected()"></select>
      </div>
      <div class="form-row">
        <span class="form-label">Name</span>
        <input id="new-cam-name" class="form-input" type="text" placeholder="e.g. front_cam">
      </div>
      <div class="form-row">
        <span class="form-label">Pipeline</span>
        <select id="new-cam-pipeline" class="form-input">
          <option value="object_detection">Object Detection</option>
        </select>
      </div>
      <div class="form-row">
        <span class="form-label">X offset</span>
        <input id="new-cam-x" class="form-input" type="number" step="0.01" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Y offset</span>
        <input id="new-cam-y" class="form-input" type="number" step="0.01" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Height (m)</span>
        <input id="new-cam-height" class="form-input" type="number" step="0.01" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Yaw (deg)</span>
        <input id="new-cam-yaw" class="form-input" type="number" step="0.1" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Pitch (deg)</span>
        <input id="new-cam-pitch" class="form-input" type="number" step="0.1" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Subsystem</span>
        <select id="new-cam-subsystem" class="form-input">
          <option value="field">Field</option>
          <option value="robot">Robot</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <span class="form-label">Grayscale</span>
        <select id="new-cam-grayscale" class="form-input">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>
    <div class="settings-section">
      <h3>Calibration</h3>
      <div class="form-row">
        <span class="form-label">Distance (m)</span>
        <input id="new-cam-cal-distance" class="form-input" type="number" step="0.01" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Game Piece Size (m)</span>
        <input id="new-cam-cal-gpsize" class="form-input" type="number" step="0.01" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">Size (px)</span>
        <input id="new-cam-cal-size" class="form-input" type="number" step="1" value="0">
      </div>
      <div class="form-row">
        <span class="form-label">FOV (deg)</span>
        <input id="new-cam-cal-fov" class="form-input" type="number" step="0.1" value="0">
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="closeAddCameraModal()" style="background:var(--border);">Cancel</button>
      <button onclick="submitAddCamera()" class="btn-ok">Add Camera</button>
    </div>
  </div>
</div>

<script>
let refreshTimer = null;
let currentRate = 1000;
let knownCameras = new Map();

function setRefreshRate() {
  currentRate = Number(document.getElementById('refresh-rate').value);
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshCameras, currentRate);
}

function closeAddCameraModal() {
  document.getElementById('add-camera-modal').style.display = 'none';
}

async function openAddCameraModal() {
  const data = await fetch('/api/cameras/discover').then(r => r.json());
  const available = (data.devices || []).filter(d => !d.active);
  const sel = document.getElementById('new-cam-device');
  sel.innerHTML = available.map(d =>
    `<option value="${d.path}" data-device-id="${d.device_id || ''}">${d.name}${d.resolution ? ' (' + d.resolution + ')' : ''}</option>`
  ).join('') || '<option disabled>No unused cameras detected</option>';
  document.getElementById('add-camera-modal').style.display = 'flex';
  onDeviceSelected();
}

async function onDeviceSelected() {
  const sel = document.getElementById('new-cam-device');
  const opt = sel.selectedOptions[0];
  if (!opt) return;
  const deviceId = opt.dataset.deviceId;
  if (!deviceId) return;
  try {
    const r = await fetch(`/api/cameras/profile/${encodeURIComponent(deviceId)}`);
    const { profile } = await r.json();
    if (profile) {
      document.getElementById('new-cam-name').value = profile.name || '';
      document.getElementById('new-cam-x').value = profile.x ?? 0;
      document.getElementById('new-cam-y').value = profile.y ?? 0;
      document.getElementById('new-cam-height').value = profile.height ?? 0;
      document.getElementById('new-cam-yaw').value = profile.yaw ?? 0;
      document.getElementById('new-cam-pitch').value = profile.pitch ?? 0;
      document.getElementById('new-cam-subsystem').value = profile.subsystem || 'field';
      document.getElementById('new-cam-grayscale').value = String(profile.grayscale || false);
      if (profile.calibration) {
        document.getElementById('new-cam-cal-distance').value = profile.calibration.distance ?? 0;
        document.getElementById('new-cam-cal-gpsize').value = profile.calibration.game_piece_size ?? 0;
        document.getElementById('new-cam-cal-size').value = profile.calibration.size ?? 0;
        document.getElementById('new-cam-cal-fov').value = profile.calibration.fov ?? 0;
      }
    }
  } catch (e) { /* no profile yet */ }
}

async function submitAddCamera() {
  const sel = document.getElementById('new-cam-device');
  const opt = sel.selectedOptions[0];
  if (!opt) { showToast('Select a device first', 'error'); return; }
  const name = document.getElementById('new-cam-name').value.trim();
  if (!name) { showToast('Camera name is required', 'error'); return; }
  const payload = {
    name: name,
    source: isNaN(Number(opt.value)) ? opt.value : Number(opt.value),
    device_id: opt.dataset.deviceId || null,
    pipeline: document.getElementById('new-cam-pipeline').value,
    x: Number(document.getElementById('new-cam-x').value),
    y: Number(document.getElementById('new-cam-y').value),
    height: Number(document.getElementById('new-cam-height').value),
    yaw: Number(document.getElementById('new-cam-yaw').value),
    pitch: Number(document.getElementById('new-cam-pitch').value),
    subsystem: document.getElementById('new-cam-subsystem').value,
    grayscale: document.getElementById('new-cam-grayscale').value === 'true',
    calibration: {
      distance: Number(document.getElementById('new-cam-cal-distance').value),
      game_piece_size: Number(document.getElementById('new-cam-cal-gpsize').value),
      size: Number(document.getElementById('new-cam-cal-size').value),
      fov: Number(document.getElementById('new-cam-cal-fov').value),
    },
  };
  const r = await fetch('/api/cameras/config', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (r.ok) {
    showToast('Camera added - restart vision to apply', 'success');
    closeAddCameraModal();
    refreshCameras();
  } else {
    showToast(j.error, 'error');
  }
}

function confirmRemoveCamera(name) {
  if (!confirm(`Remove camera "${name}"? Its settings will be saved for next time you add it back.`)) return;
  fetch(`/api/cameras/config/${encodeURIComponent(name)}`, { method: 'DELETE' })
    .then(r => r.json())
    .then(j => { showToast(j.success ? 'Camera removed' : j.error, j.success ? 'success' : 'error'); refreshCameras(); });
}

function buildCameraCard(name, isStreaming, ageText) {
  const card = document.createElement('div');
  card.className = 'card camera-card';
  card.dataset.camera = name;
  card.innerHTML = `
    <div class="camera-header">
      <span class="status-dot ${isStreaming ? 'status-ok' : 'status-warn'}"></span>
      <strong>${name}</strong>
      <span class="cam-meta">${ageText}</span>
      <button class="btn-sm btn-bad" onclick="confirmRemoveCamera('${name}')" style="margin-left:auto;">Remove</button>
    </div>
    ${isStreaming
      ? `<div class="camera-feed-wrap">
          <img class="camera-feed" src="/video/${encodeURIComponent(name)}" alt="${name}"
            onload="this.closest('.camera-feed-wrap').classList.add('feed-ok')"
            onerror="this.classList.add('feed-error'); this.closest('.camera-feed-wrap').classList.remove('feed-ok')">
        </div>`
      : `<div class="camera-not-streaming">Not streaming. Start vision to view.</div>`
    }
  `;
  return card;
}

function buildDiscoverCard(device) {
  const card = document.createElement('div');
  card.className = 'card camera-card';
  card.style.borderLeft = '3px solid var(--accent)';
  card.innerHTML = `
    <div class="camera-header">
      <span class="status-dot status-ok"></span>
      <strong>${device.name}</strong>
      <span class="cam-meta">${device.resolution || device.path}</span>
      <button class="btn-sm btn-ok" onclick="openAddCameraModal()" style="margin-left:auto;">Add</button>
    </div>
    <div class="camera-not-streaming">Discovered but not configured.</div>
  `;
  return card;
}

async function refreshCameras() {
  try {
    const [camData, discData] = await Promise.all([
      fetch('/api/cameras').then(r => r.json()),
      fetch('/api/cameras/discover').then(r => r.json()),
    ]);
    const grid = document.getElementById('camera-grid');
    const cameras = camData.cameras || [];
    const discovered = discData.devices || [];

    const streamingNames = new Set(cameras.map(c => c.name));

    if (cameras.length === 0 && discovered.length === 0) {
      grid.innerHTML = '<div class="card empty-state">No cameras detected. Connect a camera and click Refresh.</div>';
      knownCameras.clear();
      return;
    }

    const cameraMap = new Map(cameras.map(c => [c.name, c]));

    cameras.forEach(cam => {
      const name = cam.name;
      const age = cam.age_ms != null ? cam.age_ms + 'ms' : '';
      if (!knownCameras.has(name)) {
        const card = buildCameraCard(name, true, age);
        grid.appendChild(card);
        knownCameras.set(name, { streaming: true });
      } else {
        const known = knownCameras.get(name);
        if (!known.streaming) {
          const oldCard = grid.querySelector(`[data-camera="${name}"]`);
          if (oldCard) oldCard.replaceWith(buildCameraCard(name, true, age));
          knownCameras.set(name, { streaming: true });
        } else {
          const meta = grid.querySelector(`[data-camera="${name}"] .cam-meta`);
          if (meta) meta.textContent = age;
        }
      }
    });

    knownCameras.forEach((info, name) => {
      if (!streamingNames.has(name)) {
        const card = grid.querySelector(`[data-camera="${name}"]`);
        if (card) card.remove();
        knownCameras.delete(name);
      }
    });

    const existingDiscoverCards = grid.querySelectorAll('[data-discover]');
    existingDiscoverCards.forEach(c => c.remove());
    discovered.filter(d => !d.active).forEach(d => {
      grid.appendChild(buildDiscoverCard(d));
    });
  } catch (e) {
    console.error('Camera refresh failed', e);
  }
}

refreshCameras();
refreshTimer = setInterval(refreshCameras, currentRate);
</script>
{% endblock %}
