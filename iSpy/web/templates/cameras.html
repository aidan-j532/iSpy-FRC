{% extends "base.html" %}
{% block title %}Cameras - iSpy{% endblock %}
{% block content %}
<h1>Cameras</h1>
<div id="camera-controls" class="card" style="display:flex; gap:12px; align-items:center; margin-bottom:16px;">
  <label style="display:flex; align-items:center; gap:6px; color:var(--text-dim);">
    Refresh interval
    <select id="refresh-rate" onchange="setRefreshRate()">
      <option value="500">500ms</option>
      <option value="1000" selected>1s</option>
      <option value="2000">2s</option>
      <option value="5000">5s</option>
    </select>
  </label>
  <button onclick="refreshCameras()">Refresh</button>
</div>
<div id="camera-grid" class="grid"></div>
<script>
let refreshTimer = null;
let currentRate = 1000;
let knownCameras = new Set();

function setRefreshRate() {
  currentRate = Number(document.getElementById('refresh-rate').value);
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshCameras, currentRate);
}

function updateCameraStatuses(cameras) {
  cameras.forEach(c => {
    const card = document.querySelector(`[data-camera="${c.name}"]`);
    if (!card) return;
    const dot = card.querySelector('.status-dot');
    if (c.ok) {
      dot.className = 'status-dot status-ok';
    } else if (c.stale) {
      dot.className = 'status-dot status-warn';
    } else {
      dot.className = 'status-dot status-bad';
    }
    const meta = card.querySelector('.cam-meta');
    if (meta) {
      meta.textContent = c.frame_age_ms != null ? c.frame_age_ms + 'ms' : '';
    }
  });
}

async function refreshCameras() {
  try {
    const [camData, discData] = await Promise.all([
      fetch('/api/cameras').then(r => r.json()),
      fetch('/api/cameras/discover').then(r => r.json()),
    ]);
    const grid = document.getElementById('camera-grid');
    const cameras = camData.cameras || [];
    const discovered = discData.devices || [];
    const allNames = new Set([...cameras.map(c => c.name), ...discovered.map(d => d.name)]);

    if (allNames.size === 0) {
      grid.innerHTML = '<div class="card" style="color:var(--text-dim)">No cameras detected. Connect a camera and click Refresh.</div>';
      knownCameras.clear();
      return;
    }

    const cameraMap = new Map(cameras.map(c => [c.name, c]));
    const discoveredSet = new Set(discovered.map(d => d.name));

    allNames.forEach(name => {
      const cam = cameraMap.get(name);
      const isDiscovered = discoveredSet.has(name);
      if (!knownCameras.has(name)) {
        const card = document.createElement('div');
        card.className = 'card camera-card';
        card.dataset.camera = name;
        const age = cam ? (cam.age_ms != null ? cam.age_ms + 'ms' : '') : (isDiscovered ? 'detected' : '');
        card.innerHTML = `
          <div class="camera-header">
            <span class="status-dot ${cam ? 'status-ok' : isDiscovered ? 'status-warn' : 'status-bad'}"></span>
            <strong>${name}</strong>
            <span class="cam-meta" style="margin-left:auto; color:var(--text-dim); font-size:0.82rem;">${age}</span>
          </div>
          ${cam ? `<div class="camera-feed-wrap">
            <img class="camera-feed" src="/video/${encodeURIComponent(name)}" alt="${name}" onload="this.closest('.camera-feed-wrap').classList.add('feed-ok')" onerror="this.classList.add('feed-error'); this.closest('.camera-feed-wrap').classList.remove('feed-ok')">
          </div>` : `<div style="padding:16px; color:var(--text-dim); font-size:0.85rem;">Discovered but not streaming. Start vision to view.</div>`}
        `;
        grid.appendChild(card);
        knownCameras.add(name);
      } else if (cam) {
        const card = grid.querySelector(`[data-camera="${name}"]`);
        if (card && !card.querySelector('.camera-feed-wrap')) {
          card.innerHTML = `
            <div class="camera-header">
              <span class="status-dot status-ok"></span>
              <strong>${name}</strong>
              <span class="cam-meta" style="margin-left:auto; color:var(--text-dim); font-size:0.82rem;"></span>
            </div>
            <div class="camera-feed-wrap">
              <img class="camera-feed" src="/video/${encodeURIComponent(name)}" alt="${name}" onload="this.closest('.camera-feed-wrap').classList.add('feed-ok')" onerror="this.classList.add('feed-error'); this.closest('.camera-feed-wrap').classList.remove('feed-ok')">
            </div>
          `;
        }
      }
    });

    knownCameras.forEach(name => {
      if (!allNames.has(name)) {
        const card = grid.querySelector(`[data-camera="${name}"]`);
        if (card) card.remove();
        knownCameras.delete(name);
      }
    });

    updateCameraStatuses(cameras);
  } catch (e) {
    console.error('Camera refresh failed', e);
  }
}

refreshCameras();
refreshTimer = setInterval(refreshCameras, currentRate);
</script>
{% endblock %}
