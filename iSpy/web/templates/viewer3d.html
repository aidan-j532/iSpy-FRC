{% extends "base.html" %}
{% block title %}3D Viewer - iSpy{% endblock %}
{% block head %}
<style>
#scene-container { width:100%; height:65vh; background:#0a0a0f; border-radius:8px; position:relative; overflow:hidden; }
#scene-container canvas { display:block; }
.viewer-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.viewer-toolbar label { color:var(--text-dim); font-size:0.85rem; display:flex; align-items:center; gap:6px; }
.viewer-toolbar select { background:var(--bg); color:var(--text); border:1px solid var(--border); padding:4px 8px; border-radius:var(--radius); }
#object-list { max-height:200px; overflow-y:auto; }
#object-list table { width:100%; }
.obj-row td { font-size:0.82rem; }
</style>
{% endblock %}
{% block content %}
<h1>3D Detection Viewer</h1>
<div class="viewer-toolbar">
  <label>Camera
    <select id="view-preset" onchange="setViewPreset()">
      <option value="default">Default</option>
      <option value="top">Top-down</option>
      <option value="front">Front</option>
      <option value="side">Side</option>
    </select>
  </label>
  <label style="margin-left:auto;">
    <input type="checkbox" id="show-grid" checked onchange="toggleGrid()"> Grid
  </label>
  <label>
    <input type="checkbox" id="show-axes" checked onchange="toggleAxes()"> Axes
  </label>
  <label>
    <input type="checkbox" id="light-bg" onchange="toggleLightBg()"> White BG
  </label>
</div>
<div id="scene-container"></div>
<div class="card" style="margin-top:12px;">
  <h3>Detections</h3>
  <div id="object-list">
    <table>
      <thead><tr><th>ID</th><th>X</th><th>Y</th><th>Z</th><th>Yaw</th><th>Vis</th></tr></thead>
      <tbody id="obj-tbody"></tbody>
    </table>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 200);
camera.position.set(0, 8, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.update();

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);
const hemiLight = new THREE.HemisphereLight(0x4c8bf5, 0x111318, 0.3);
scene.add(hemiLight);

const gridHelper = new THREE.GridHelper(20, 20, 0x2a2e38, 0x1a1d24);
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(8);
scene.add(axesHelper);

window.toggleGrid = function() {
  gridHelper.visible = document.getElementById('show-grid').checked;
};
window.toggleAxes = function() {
  axesHelper.visible = document.getElementById('show-axes').checked;
};
let lightBg = false;
window.toggleLightBg = function() {
  lightBg = document.getElementById('light-bg').checked;
  if (lightBg) {
    scene.background = new THREE.Color(0xf0f0f0);
    scene.fog = null;
    gridHelper.material.color.set(0x888888);
    gridHelper.material.color2.set(0xcccccc);
    container.style.background = '#f0f0f0';
  } else {
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);
    gridHelper.material.color.set(0x2a2e38);
    gridHelper.material.color2.set(0x1a1d24);
    container.style.background = '#0a0a0f';
  }
};

const PRESETS = {
  default: { pos: [0, 8, 14], target: [0, 0, 0] },
  top: { pos: [0, 22, 0.01], target: [0, 0, 0] },
  front: { pos: [0, 2, 18], target: [0, 0, 0] },
  side: { pos: [18, 2, 0], target: [0, 0, 0] },
};
window.setViewPreset = function() {
  const p = PRESETS[document.getElementById('view-preset').value] || PRESETS.default;
  camera.position.set(...p.pos);
  controls.target.set(...p.target);
  controls.update();
};

const boxes = {};
const BOX_COLOR = 0x4c8bf5;
// every detection is normalized into a 20x20x20 scene (centered, scaled to its
// bounding box), so everything renders at a consistent size no matter whether
// the raw coordinates span 0.01 or 10000 units
const SCENE_UNITS = 20;
let viewScale = 1;
const viewCenter = new THREE.Vector3(0, 0, 0);

// helpers

function disposeMesh(obj) {
  if (obj.geometry) obj.geometry.dispose();
  if (obj.material) {
    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
    else obj.material.dispose();
  }
  if (obj.children) {
    for (const c of obj.children.slice()) disposeMesh(c);
  }
}

// map a raw [x, y, z] position into the normalized 20x20x20 scene (Z-up viewer)
function toViewer(px, py, pz) {
  return new THREE.Vector3(
    (px - viewCenter.x) * viewScale,
    (pz - viewCenter.z) * viewScale,
    (py - viewCenter.y) * viewScale,
  );
}

// compute the frame's center + scale so the full content spans <= SCENE_UNITS
function computeViewTransform(objects) {
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  const add = (px, py, pz) => {
    if (px < minX) minX = px;
    if (py < minY) minY = py;
    if (pz < minZ) minZ = pz;
    if (px > maxX) maxX = px;
    if (py > maxY) maxY = py;
    if (pz > maxZ) maxZ = pz;
  };
  for (const o of objects) {
    add(o.x || 0, o.y || 0, o.z || 0);
    if (Array.isArray(o.keypoints_3d)) {
      for (const k of o.keypoints_3d) {
        if (Array.isArray(k) && k.length >= 3) add(k[0], k[1], k[2]);
      }
    }
  }
  if (!isFinite(minX)) return;
  const extent = Math.max(maxX - minX, maxY - minY, maxZ - minZ);
  viewScale = extent > 1e-9 ? SCENE_UNITS / extent : 1;
  viewCenter.set((minX + maxX) / 2, (minY + maxY) / 2, (minZ + maxZ) / 2);
}

// vis renderer registry - register a {create, update} pair keyed by vis_type, nothing else changes

function makeCubeMarker() {
  const geo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
  const mat = new THREE.MeshStandardMaterial({ color: BOX_COLOR, transparent: true, opacity: 0.85 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  const wireGeo = new THREE.EdgesGeometry(geo);
  const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
  mesh.add(new THREE.LineSegments(wireGeo, wireMat));
  return mesh;
}

function updateCubeMarker(mesh, o) {
  mesh.position.copy(toViewer(o.x, o.y, o.z));
  mesh.rotation.set(o.roll, o.yaw, o.pitch);
}

// flat rect + axes gizmo for planar fiducials (apriltags etc); vis_meta.size sets edge length
function makePlanarMarker(o) {
  const g = new THREE.Group();
  const size = Math.max(0.1, (Math.max(0.05, (o.vis_meta && o.vis_meta.size) || 0.2) * viewScale));

  const planeGeo = new THREE.PlaneGeometry(size, size);
  const planeMat = new THREE.MeshStandardMaterial({
    color: 0xffaa00, transparent: true, opacity: 0.75, side: THREE.DoubleSide,
  });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  g.add(plane);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(planeGeo),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }),
  );
  g.add(edges);

  const axesLen = size * 0.6;
  g.add(new THREE.AxesHelper(axesLen));

  g.userData.planarSize = size;
  return g;
}

function updatePlanarMarker(g, o) {
  g.position.copy(toViewer(o.x, o.y, o.z));
  g.rotation.set(o.roll, o.yaw, o.pitch);
  const size = Math.max(0.1, Math.min(3, Math.max(0.05, (o.vis_meta && o.vis_meta.size) || 0.2) * viewScale));
  const base = g.userData.planarSize || size;
  g.scale.setScalar(size / base);
}

const DOT_RADIUS = 0.15;

// just plot the points, no bones - count can vary frame to frame
function buildPointCloud(kpts3d) {
  const g = new THREE.Group();

  const pts = kpts3d.map(k => toViewer(k[0], k[1], k[2]));
  const dotGeo = new THREE.SphereGeometry(DOT_RADIUS, 12, 12);
  const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });

  for (const p of pts) {
    const m = new THREE.Mesh(dotGeo, dotMat);
    m.position.copy(p);
    g.add(m);
  }
  g.userData.dotRadius = DOT_RADIUS;
  return g;
}

function updatePointCloud(g, kpts3d) {
  const pts = kpts3d.map(k => toViewer(k[0], k[1], k[2]));

  while (g.children.length < pts.length) {
    const dotGeo = new THREE.SphereGeometry(g.userData.dotRadius || DOT_RADIUS, 12, 12);
    const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
    g.add(new THREE.Mesh(dotGeo, dotMat));
  }
  while (g.children.length > pts.length) {
    const extra = g.children.pop();
    disposeMesh(extra);
  }
  for (let i = 0; i < pts.length; i++) {
    g.children[i].position.copy(pts[i]);
  }
}

const VIS_RENDERERS = {
  generic: { create: () => makeCubeMarker(),     update: updateCubeMarker },
  points:  { create: (o) => buildPointCloud(o.keypoints_3d),
             update: (g, o) => updatePointCloud(g, o.keypoints_3d) },
  planar:  { create: (o) => makePlanarMarker(o), update: updatePlanarMarker },
};

function resolveVisType(o) {
  // back-compat: keypoints_3d forces the points renderer even if vis_type is missing
  const hasKp = o.keypoints_3d && o.keypoints_3d.length >= 3;
  if (hasKp) return "points";
  if (o.vis_type && VIS_RENDERERS[o.vis_type]) return o.vis_type;
  return "generic";
}

// main sync

function createBoxForDetection(o) {
  const key = o.id;
  const visType = resolveVisType(o);
  const prev = boxes[key];
  if (prev) {
    if (prev.userData.visType === visType) return prev;
    cleanupBox(key);
  }

  const renderer = VIS_RENDERERS[visType] || VIS_RENDERERS.generic;
  const obj3d = renderer.create(o);
  obj3d.userData.visType = visType;
  scene.add(obj3d);
  return obj3d;
}

function updateExistingBox(obj3d, o) {
  const visType = obj3d.userData.visType || "generic";
  const renderer = VIS_RENDERERS[visType] || VIS_RENDERERS.generic;
  renderer.update(obj3d, o);
}

function cleanupBox(key) {
  const obj = boxes[key];
  if (!obj) return;
  scene.remove(obj);
  disposeMesh(obj);
  delete boxes[key];
}

function sync(objects) {
  const seen = new Set();
  const tbody = document.getElementById('obj-tbody');
  let rows = '';

  computeViewTransform(objects);

  for (const o of objects) {
    seen.add(o.id);
    const key = o.id;
    const visType = resolveVisType(o);

    if (!boxes[key]) {
      boxes[key] = createBoxForDetection(o);
    } else if (boxes[key].userData.visType !== visType) {
      boxes[key] = createBoxForDetection(o);
    } else {
      updateExistingBox(boxes[key], o);
    }

    const nk = o.num_keypoints || (o.keypoints_3d ? o.keypoints_3d.length : 0);
    const label = visType === 'points' ? `${nk} pts`
                : visType === 'planar' ? (o.vis_meta && o.vis_meta.tag_id != null ? `tag ${o.vis_meta.tag_id}` : 'planar')
                : '-';
    rows += `<tr class="obj-row"><td>${o.id}</td><td>${o.x?.toFixed(2)}</td><td>${o.y?.toFixed(2)}</td><td>${o.z?.toFixed(2)}</td><td>${(o.yaw * 180 / Math.PI)?.toFixed(1)}&deg;</td><td>${label}</td></tr>`;
  }

  for (const k in boxes) {
    const idNum = parseInt(k, 10);
    if (!isNaN(idNum) && !seen.has(idNum)) {
      cleanupBox(k);
    }
  }

  tbody.innerHTML = rows || '<tr><td colspan="6" class="empty-state">No detections</td></tr>';
}

// poll & animate

async function poll() {
  try {
    const d = await fetch('/api/detections/latest').then(r => r.json());
    sync(d.objects || []);
  } catch (_) {}
}
setInterval(poll, 200);

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
{% endblock %}
