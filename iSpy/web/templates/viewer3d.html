{% extends "base.html" %} {% block title %}3D Viewer - iSpy{% endblock %} {%
block head %}
<style>
  .viewer-layout {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  #scene-container {
    flex: 1;
    min-width: 0;
    height: 65vh;
    background: #0a0a0f;
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
  }
  #scene-container canvas {
    display: block;
  }
  .viewer-panel {
    width: 190px;
    flex: none;
    height: 65vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    overflow-y: auto;
  }
  .panel-title {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .scale-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .axis {
    width: 20px;
    height: 20px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    font-size: 0.72rem;
    font-weight: 700;
    color: #f7f8fa;
  }
  .axis-x {
    background: #ff4d4d;
  }
  .axis-y {
    background: #3ddc84;
  }
  .axis-z {
    background: #4d7eff;
  }
  .scale-row input[type="range"] {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
  }
  .scale-row input[type="number"] {
    width: 60px;
    flex: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 0.8rem;
  }
  #scale-reset {
    margin-top: auto;
  }
  .viewer-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .viewer-toolbar label {
    color: var(--text-dim);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .viewer-toolbar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: var(--radius);
  }
  #object-list {
    max-height: 200px;
    overflow-y: auto;
  }
  #object-list table {
    width: 100%;
  }
  .obj-row td {
    font-size: 0.82rem;
  }
  .obj-row {
    cursor: pointer;
  }
  .obj-row.selected td {
    background: rgba(227, 82, 5, 0.14);
    outline: 1px solid var(--accent);
  }
  .empty-row-note {
    color: var(--text-dim);
    font-size: 0.8rem;
  }
</style>
{% endblock %} {% block content %}
<h1>3D Detection Viewer</h1>
<div class="viewer-toolbar">
  <label
    >Camera
    <select id="view-preset" onchange="setViewPreset()">
      <option value="default">Default</option>
      <option value="top">Top-down</option>
      <option value="front">Front</option>
      <option value="side">Side</option>
    </select>
  </label>
  <label style="margin-left: auto">
    <input type="checkbox" id="show-grid" checked onchange="toggleGrid()" />
    Grid
  </label>
  <label>
    <input type="checkbox" id="show-axes" checked onchange="toggleAxes()" />
    Axes
  </label>
  <label>
    <input type="checkbox" id="light-bg" onchange="toggleLightBg()" /> White BG
  </label>
  <label>
    <input
      type="checkbox"
      id="show-overlays"
      checked
      onchange="toggleOverlays()"
    />
    Overlays
  </label>
</div>
<div class="viewer-layout">
  <div id="scene-container"></div>
  <div class="viewer-panel">
    <div class="panel-title">
      View Scale<button
        type="button"
        class="help-tip"
        id="scale-help"
        data-help="Scale detections per axis. Set a negative value to flip an axis."
        aria-label="More information"
      >?</button>
    </div>
    <div class="scale-row">
      <span class="axis axis-x">X</span>
      <input
        type="range"
        id="scale-x-range"
        min="-10"
        max="10"
        step="0.1"
        value="1"
        aria-label="X scale"
      />
      <input
        type="number"
        id="scale-x-value"
        value="1"
        step="0.1"
        aria-label="X scale value"
      />
    </div>
    <div class="scale-row">
      <span class="axis axis-y">Y</span>
      <input
        type="range"
        id="scale-y-range"
        min="-10"
        max="10"
        step="0.1"
        value="1"
        aria-label="Y scale"
      />
      <input
        type="number"
        id="scale-y-value"
        value="1"
        step="0.1"
        aria-label="Y scale value"
      />
    </div>
    <div class="scale-row">
      <span class="axis axis-z">Z</span>
      <input
        type="range"
        id="scale-z-range"
        min="-10"
        max="10"
        step="0.1"
        value="1"
        aria-label="Z scale"
      />
      <input
        type="number"
        id="scale-z-value"
        value="1"
        step="0.1"
        aria-label="Z scale value"
      />
    </div>
    <button type="button" class="btn" id="scale-reset">Reset Scale</button>
  </div>
</div>
<div class="card" style="margin-top: 12px">
  <h3>Detections And Overlays</h3>
  <div id="object-list">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th id="th-x">X</th>
          <th id="th-y">Y</th>
          <th id="th-z">Z</th>
          <th>Pitch</th>
          <th>Yaw</th>
          <th>Roll</th>
          <th>Vis</th>
        </tr>
      </thead>
      <tbody id="obj-tbody"></tbody>
    </table>
  </div>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three.module.js",
      "three/addons/": "/static/vendor/",
      "robotpose": "/static/js/robotpose.js"
    }
  }
</script>
<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/OrbitControls.js";
  import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
  import { LineMaterial } from "three/addons/lines/LineMaterial.js";
  import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
  import { robotToViewer, robotToViewerQuat } from "robotpose";

  // Unit-pack viewer settings (Units/*.json -> viewer). The server deep-merges
  // these over built-in defaults, so every key is always present.
  const VIEWER_CONFIG = {{ viewer_config | tojson }};
  const AXIS_MAP = VIEWER_CONFIG.robot_to_viewer;
  const VIEWER_BOUNDS = VIEWER_CONFIG.bounds_viewer;
  const CAMERA_CONFIG = VIEWER_CONFIG.camera;
  const OUTPUT_LABEL = VIEWER_CONFIG.output_label;
  const FOG_DENSITY = VIEWER_CONFIG.fog_density;
  const AXES_SIZE = VIEWER_CONFIG.axes_size;

  for (const axis of ["x", "y", "z"]) {
    document.getElementById(`th-${axis}`).textContent =
      `${axis.toUpperCase()} (${OUTPUT_LABEL})`;
  }
  const scaleHelp = document.getElementById("scale-help");
  if (scaleHelp) {
    scaleHelp.setAttribute(
      "data-help",
      `Scale detections per axis (${OUTPUT_LABEL}). ` +
        "Set a negative value to flip an axis.",
    );
  }

  const container = document.getElementById("scene-container");
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.FogExp2(0x0a0a0f, FOG_DENSITY);

  const camera = new THREE.PerspectiveCamera(
    CAMERA_CONFIG.fov,
    container.clientWidth / container.clientHeight,
    CAMERA_CONFIG.near,
    CAMERA_CONFIG.far,
  );
  camera.position.set(...CAMERA_CONFIG.position);
  camera.lookAt(...CAMERA_CONFIG.target);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(...CAMERA_CONFIG.target);
  controls.update();

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);
  const hemiLight = new THREE.HemisphereLight(0xe35205, 0x111318, 0.3);
  scene.add(hemiLight);

  // WebGL caps LineBasicMaterial linewidth at 1px on most platforms, which makes
  // thin wireframes shimmer/alias at glancing angles. LineSegments2 + LineMaterial
  // render true pixel-width lines instead, so "slightly thicker" actually works.
  const fatMats = [];
  function trackFat(mat) {
    mat.resolution.set(renderer.domElement.width, renderer.domElement.height);
    fatMats.push(mat);
    return mat;
  }
  function updateFatRes() {
    const r = renderer.domElement;
    for (const m of fatMats) m.resolution.set(r.width, r.height);
  }

  const GRID_EXTENT = VIEWER_CONFIG.grid.extent;
  const GRID_DIVS = VIEWER_CONFIG.grid.divisions;

  function buildFatGrid(centerColor, gridColor, linewidth) {
    const positions = [];
    const half = GRID_EXTENT / 2;
    const step = GRID_EXTENT / GRID_DIVS;
    for (let i = 0; i <= GRID_DIVS; i++) {
      const p = -half + i * step;
      positions.push(-half, 0, p, half, 0, p);
      positions.push(p, 0, -half, p, 0, half);
    }
    const segCount = positions.length / 6;
    const geo = new LineSegmentsGeometry().setPositions(positions);
    geo.setColors(gridColorArray(segCount, centerColor, gridColor));
    const mat = trackFat(
      new LineMaterial({ color: 0xffffff, linewidth, vertexColors: true }),
    );
    const mesh = new LineSegments2(geo, mat);
    mesh.userData.segCount = segCount;
    mesh.frustumCulled = false;
    return mesh;
  }

  function gridColorArray(segCount, centerColor, gridColor) {
    const out = new Float32Array(segCount * 6);
    const half = GRID_EXTENT / 2;
    const step = GRID_EXTENT / GRID_DIVS;
    const cc = new THREE.Color(centerColor);
    const cg = new THREE.Color(gridColor);
    let s = 0;
    for (let i = 0; i <= GRID_DIVS; i++) {
      const isCenter = Math.abs(-half + i * step) < step * 0.5;
      const c = isCenter ? cc : cg;
      for (let l = 0; l < 2; l++) {
        out[s++] = c.r;
        out[s++] = c.g;
        out[s++] = c.b;
        out[s++] = c.r;
        out[s++] = c.g;
        out[s++] = c.b;
      }
    }
    return out;
  }

  function setGridColors(centerColor, gridColor) {
    const colors = gridColorArray(
      gridHelper.userData.segCount,
      centerColor,
      gridColor,
    );
    const attrs = gridHelper.geometry.attributes;
    if (attrs.instanceColorStart && attrs.instanceColorStart.data) {
      attrs.instanceColorStart.data.array.set(colors);
      attrs.instanceColorStart.data.needsUpdate = true;
    }
  }

  const gridHelper = buildFatGrid(0x2a2e38, 0x1a1d24, 1.6);
  scene.add(gridHelper);

  function solidAxes(size) {
    // Solid-color X/Y/Z axes as 3D geometry (shaft + cone tip). Lines rendered
    // as polylines - even the fat-line shader - calculate NaN when a segment is
    // viewed nearly end-on, which makes them flicker/disappear while orbiting.
    // Solid cylinders project cleanly from every angle.
    const R = Math.max(0.015, size * 0.004);
    function axis(len, color) {
      const mat = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: 0.25,
        fog: false,
      });
      const grp = new THREE.Group();
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(R, R, len, 10),
        mat,
      );
      shaft.position.y = len / 2;
      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(R * 2.4, R * 6, 10),
        mat,
      );
      tip.position.y = len + R * 3;
      grp.add(shaft, tip);
      return grp;
    }
    const x = axis(size, 0xff0000);
    x.rotation.z = -Math.PI / 2; // +X
    const y = axis(size, 0x00ff00); // +Y
    const z = axis(size, 0x0000ff);
    z.rotation.x = Math.PI / 2; // +Z
    const g = new THREE.Group();
    g.add(x, y, z);
    g.traverse((o) => {
      if (o.isMesh) o.frustumCulled = false;
    });
    return g;
  }
  const axesHelper = solidAxes(AXES_SIZE);
  scene.add(axesHelper);

  // detections and overlays live in this group so the per-axis scale controls
  // can transform them without touching the grid or axes.
  const worldGroup = new THREE.Group();
  scene.add(worldGroup);

  window.toggleGrid = function () {
    gridHelper.visible = document.getElementById("show-grid").checked;
  };
  window.toggleAxes = function () {
    axesHelper.visible = document.getElementById("show-axes").checked;
  };
  let lightBg = false;
  window.toggleLightBg = function () {
    lightBg = document.getElementById("light-bg").checked;
    if (lightBg) {
      scene.background = new THREE.Color(0xffffff);
      scene.fog = null;
      setGridColors(0x888888, 0xcccccc);
      container.style.background = "#ffffff";
    } else {
      scene.background = new THREE.Color(0x0a0a0f);
      scene.fog = new THREE.FogExp2(0x0a0a0f, FOG_DENSITY);
      setGridColors(0x2a2e38, 0x1a1d24);
      container.style.background = "#0a0a0f";
    }
  };

  const BOUND_CENTER = {
    x: (VIEWER_BOUNDS.x.min + VIEWER_BOUNDS.x.max) / 2,
    y: (VIEWER_BOUNDS.y.min + VIEWER_BOUNDS.y.max) / 2,
    z: (VIEWER_BOUNDS.z.min + VIEWER_BOUNDS.z.max) / 2,
  };
  const BOUND_SPAN = Math.max(
    VIEWER_BOUNDS.x.max - VIEWER_BOUNDS.x.min,
    VIEWER_BOUNDS.y.max - VIEWER_BOUNDS.y.min,
    VIEWER_BOUNDS.z.max - VIEWER_BOUNDS.z.min,
    1,
  );
  const PRESETS = {
    default: { pos: CAMERA_CONFIG.position, target: CAMERA_CONFIG.target },
    top: {
      pos: [
        BOUND_CENTER.x,
        BOUND_CENTER.y + BOUND_SPAN * 1.25,
        BOUND_CENTER.z + BOUND_SPAN * 0.001,
      ],
      target: [BOUND_CENTER.x, BOUND_CENTER.y, BOUND_CENTER.z],
    },
    front: {
      pos: [
        BOUND_CENTER.x,
        BOUND_CENTER.y + BOUND_SPAN * 0.1,
        VIEWER_BOUNDS.z.max + BOUND_SPAN * 0.9,
      ],
      target: [BOUND_CENTER.x, BOUND_CENTER.y, BOUND_CENTER.z],
    },
    side: {
      pos: [
        VIEWER_BOUNDS.x.max + BOUND_SPAN * 0.9,
        BOUND_CENTER.y + BOUND_SPAN * 0.1,
        BOUND_CENTER.z,
      ],
      target: [BOUND_CENTER.x, BOUND_CENTER.y, BOUND_CENTER.z],
    },
  };
  window.setViewPreset = function () {
    const p =
      PRESETS[document.getElementById("view-preset").value] || PRESETS.default;
    camera.position.set(...p.pos);
    controls.target.set(...p.target);
    controls.update();
  };

  const GRID_UNIT = VIEWER_CONFIG.grid.marker_size;
  const MIN_MARKER_SIZE = Math.max(0.001, GRID_UNIT * 0.08);
  // The historical viewer was designed around a 0.25-unit marker.  Scaling
  // the plugin overlay defaults by the pack's marker size keeps them
  // proportionate when the pack publishes inches instead of meters.
  const UNIT_SCALE = GRID_UNIT / 0.25;
  const CUBE_SIZE = GRID_UNIT;
  const DOT_RADIUS = Math.max(MIN_MARKER_SIZE, GRID_UNIT * 0.2);
  const OVERLAY_BOX_SIZE = GRID_UNIT * 2;
  const OVERLAY_SPHERE_RADIUS = GRID_UNIT;
  const CAMERA_FRUSTUM_DEPTH = GRID_UNIT * 4;
  const CAMERA_POINT_RADIUS = Math.max(MIN_MARKER_SIZE, GRID_UNIT * 0.24);
  const ROBOT_DEFAULTS = {
    width: 0.76 * UNIT_SCALE,
    height: 0.3 * UNIT_SCALE,
    depth: 0.69 * UNIT_SCALE,
  };
  const BOX_COLOR = 0xe35205;

  function disposeMesh(obj) {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
      else obj.material.dispose();
    }
    if (obj.children) {
      for (const c of obj.children.slice()) disposeMesh(c);
    }
  }

  function makeFatEdges(edgesGeo, color, opacity, linewidth) {
    const geo = new LineSegmentsGeometry().fromEdgesGeometry(edgesGeo);
    const mat = trackFat(
      new LineMaterial({
        color,
        transparent: true,
        opacity,
        linewidth,
      }),
    );
    return new LineSegments2(geo, mat);
  }

  function toViewer(px, py, pz) {
    const [x, y, z] = robotToViewer(px, py, pz, AXIS_MAP);
    return new THREE.Vector3(x, y, z);
  }

  function makeCubeMarker() {
    const geo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
    const mat = new THREE.MeshStandardMaterial({
      color: BOX_COLOR,
      transparent: true,
      opacity: 0.85,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    const wireGeo = new THREE.EdgesGeometry(geo);
    mesh.add(makeFatEdges(wireGeo, 0xffffff, 0.3, 2));
    return mesh;
  }

  function updateCubeMarker(mesh, o) {
    mesh.position.copy(toViewer(o.x, o.y, o.z));
    // Object roll/pitch/yaw are robot-frame (R = Rz(yaw)*Ry(pitch)*Rx(roll), the
    // order _matrix_to_euler decodes), so move them into the viewer frame as a
    // quaternion. A frame-swapped euler folds tilted objects into the wrong plane.
    mesh.quaternion.set(
      ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
    );
    const wire = mesh.children.find(
      (c) => c.isLineSegments || c.isLineSegments2,
    );
    if (wire) {
      wire.material.color.setHex(selectedId === o.id ? 0xff8a4c : 0xffffff);
      wire.material.opacity = selectedId === o.id ? 0.9 : 0.3;
    }
  }

  function makePlanarMarker(o) {
    const g = new THREE.Group();
    const size = Math.max(
      MIN_MARKER_SIZE,
      (o.vis_meta && o.vis_meta.size) || GRID_UNIT,
    );
    const planeGeo = new THREE.PlaneGeometry(size, size);
    const planeMat = new THREE.MeshStandardMaterial({
      color: 0xffaa00,
      transparent: true,
      opacity: 0.75,
      side: THREE.DoubleSide,
    });
    g.add(new THREE.Mesh(planeGeo, planeMat));
    g.add(makeFatEdges(new THREE.EdgesGeometry(planeGeo), 0xffffff, 0.5, 2));
    const tagAxes = solidAxes(size * 0.6);
    g.add(tagAxes);
    g.userData.planarSize = size;
    return g;
  }

  function updatePlanarMarker(g, o) {
    g.position.copy(toViewer(o.x, o.y, o.z));
    // same convention as updateCubeMarker: eulers are robot-frame ZYX, applied
    // as a quaternion so the tag tilts the way it actually tilts on the field
    g.quaternion.set(
      ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
    );
    const size = Math.max(
      MIN_MARKER_SIZE,
      (o.vis_meta && o.vis_meta.size) || GRID_UNIT,
    );
    g.scale.setScalar(size / (g.userData.planarSize || size));
    const wire = g.children.find((c) => c.isLineSegments || c.isLineSegments2);
    if (wire) {
      wire.material.color.setHex(selectedId === o.id ? 0xff8a4c : 0xffffff);
      wire.material.opacity = selectedId === o.id ? 0.9 : 0.5;
    }
  }

  function buildPointCloud(kpts3d) {
    const g = new THREE.Group();
    const pts = kpts3d.map((k) => toViewer(k[0], k[1], k[2]));
    const dotGeo = new THREE.SphereGeometry(DOT_RADIUS, 12, 12);
    const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
    for (const p of pts) {
      const m = new THREE.Mesh(dotGeo, dotMat);
      m.position.copy(p);
      g.add(m);
    }
    g.userData.dotRadius = DOT_RADIUS;
    return g;
  }

  function updatePointCloud(g, kpts3d) {
    const pts = kpts3d.map((k) => toViewer(k[0], k[1], k[2]));
    while (g.children.length < pts.length) {
      const dotGeo = new THREE.SphereGeometry(
        g.userData.dotRadius || DOT_RADIUS,
        12,
        12,
      );
      const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
      g.add(new THREE.Mesh(dotGeo, dotMat));
    }
    while (g.children.length > pts.length) {
      const extra = g.children.pop();
      disposeMesh(extra);
    }
    for (let i = 0; i < pts.length; i++) {
      g.children[i].position.copy(pts[i]);
    }
  }

  const VIS_RENDERERS = {
    generic: { create: () => makeCubeMarker(), update: updateCubeMarker },
    points: {
      create: (o) => buildPointCloud(o.keypoints_3d),
      update: (g, o) => updatePointCloud(g, o.keypoints_3d),
    },
    planar: { create: (o) => makePlanarMarker(o), update: updatePlanarMarker },
  };

  function resolveVisType(o) {
    const hasKp = o.keypoints_3d && o.keypoints_3d.length >= 3;
    if (hasKp) return "points";
    if (o.vis_type && VIS_RENDERERS[o.vis_type]) return o.vis_type;
    return "generic";
  }

  const boxes = {};
  // the currently selected target's id (drives row + marker highlight).
  // kept in sync with the target_selector /api status endpoint each poll.
  let selectedId = null;

  function createBoxForDetection(o) {
    const key = o.id;
    const visType = resolveVisType(o);
    const prev = boxes[key];
    if (prev) {
      if (prev.userData.visType === visType) return prev;
      cleanupBox(key);
    }
    const renderer = VIS_RENDERERS[visType] || VIS_RENDERERS.generic;
    const obj3d = renderer.create(o);
    obj3d.userData.visType = visType;
    worldGroup.add(obj3d);
    return obj3d;
  }

  function updateExistingBox(obj3d, o) {
    const visType = obj3d.userData.visType || "generic";
    const renderer = VIS_RENDERERS[visType] || VIS_RENDERERS.generic;
    renderer.update(obj3d, o);
  }

  function cleanupBox(key) {
    const obj = boxes[key];
    if (!obj) return;
    // boxes live under worldGroup, not scene
    worldGroup.remove(obj);
    disposeMesh(obj);
    delete boxes[key];
  }

  function syncDetections(objects) {
    const seen = new Set();
    for (const o of objects) {
      seen.add(o.id);
      const key = o.id;
      const visType = resolveVisType(o);
      if (!boxes[key]) {
        boxes[key] = createBoxForDetection(o);
      } else if (boxes[key].userData.visType !== visType) {
        boxes[key] = createBoxForDetection(o);
      } else {
        updateExistingBox(boxes[key], o);
      }
    }
    for (const k in boxes) {
      const idNum = parseInt(k, 10);
      if (!isNaN(idNum) && !seen.has(idNum)) {
        cleanupBox(k);
      }
    }
  }

  // Each renderer is a { create(overlay), update(mesh, overlay) }
  // pair keyed by the overlay's "type" field.  Add-ons push
  // overlay dicts via Viewer3DModule.add_overlay(); the frontend
  // renders them through this registry.

  function parseColor(hex, fallback) {
    if (!hex) return fallback;
    try {
      return parseInt(hex.replace("#", ""), 16);
    } catch {
      return fallback;
    }
  }

  const OVERLAY_RENDERERS = {
    box: {
      create(o) {
        const d = o.data || {};
        const w = d.width || OVERLAY_BOX_SIZE,
          h = d.height || OVERLAY_BOX_SIZE,
          dep = d.depth || OVERLAY_BOX_SIZE;
        const geo = new THREE.BoxGeometry(w, h, dep);
        const col = parseColor(o.color, 0xe35205);
        const mat = new THREE.MeshStandardMaterial({
          color: col,
          transparent: true,
          opacity: 0.8,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        const wireGeo = new THREE.EdgesGeometry(geo);
        mesh.add(makeFatEdges(wireGeo, 0xffffff, 0.25, 2));
        return mesh;
      },
      update(mesh, o) {
        mesh.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
        mesh.quaternion.set(
          ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
        );
      },
    },

    sphere: {
      create(o) {
        const d = o.data || {};
        const r = d.radius || OVERLAY_SPHERE_RADIUS;
        const geo = new THREE.SphereGeometry(r, 20, 20);
        const col = parseColor(o.color, 0xe35205);
        const mat = new THREE.MeshStandardMaterial({
          color: col,
          transparent: true,
          opacity: 0.8,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        return mesh;
      },
      update(mesh, o) {
        mesh.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
        mesh.quaternion.set(
          ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
        );
      },
    },

    camera: {
      _buildFov(g, fov) {
        // remove old frustum lines
        const old = g.userData.frustum;
        if (old) {
          g.remove(old);
          if (old.geometry) old.geometry.dispose();
          if (old.material) old.material.dispose();
        }
        const d = CAMERA_FRUSTUM_DEPTH;
        const half = Math.tan(((fov || 60) * Math.PI) / 180 / 2) * d;
        const w = half;
        const h = half * 0.75;
        const corners = [
          [-w, -h, d],
          [w, -h, d],
          [w, h, d],
          [-w, h, d],
        ];
        const positions = [];
        for (const c of corners) positions.push(0, 0, 0, c[0], c[1], c[2]);
        for (let i = 0; i < 4; i++) {
          const a = corners[i];
          const b = corners[(i + 1) % 4];
          positions.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3),
        );
        const mat = new THREE.LineBasicMaterial({
          color: 0xffaa00,
          transparent: true,
          opacity: 0.8,
        });
        const lines = new THREE.LineSegments(geo, mat);
        g.add(lines);
        g.userData.frustum = lines;
        g.userData.fov = fov;
      },
      create(o) {
        const g = new THREE.Group();
        // camera is just a point
        const point = new THREE.Mesh(
          new THREE.SphereGeometry(CAMERA_POINT_RADIUS, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0xffaa00 }),
        );
        g.add(point);
        this._buildFov(g, (o.data && o.data.fov) || 60);
        return g;
      },
      update(g, o) {
        g.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
        g.quaternion.set(
          ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
        );
        const fov = (o.data && o.data.fov) || 60;
        if (g.userData.fov !== fov) this._buildFov(g, fov);
      },
    },

    robot: {
      create(o) {
        const g = new THREE.Group();
        const d = o.data || {};
        const w = d.width || ROBOT_DEFAULTS.width;
        const h = d.height || ROBOT_DEFAULTS.height;
        const dep = d.depth || ROBOT_DEFAULTS.depth;
        const geo = new THREE.BoxGeometry(w, h, dep);
        const edges = new THREE.EdgesGeometry(geo);
        const mat = new THREE.LineBasicMaterial({
          color: parseColor(o.color, 0xe35205),
          transparent: true,
          opacity: 0.9,
        });
        const wire = new THREE.LineSegments(edges, mat);
        g.add(wire);
        return g;
      },
      update(g, o) {
        g.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
        g.quaternion.set(
          ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
        );
      },
    },

    group: {
      create(o) {
        const g = new THREE.Group();
        g.userData.overlayDef = o;
        return g;
      },
      update(g, o) {
        g.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
        g.quaternion.set(
          ...robotToViewerQuat(o.roll || 0, o.pitch || 0, o.yaw || 0, AXIS_MAP),
        );
        const children = (o.data && o.data.children) || [];
        syncOverlayChildren(g, children);
      },
    },
  };

  function syncOverlayChildren(group, childrenDef) {
    const existing = group.userData.childMeshes || {};
    const seen = new Set();
    for (const childDef of childrenDef) {
      const cid = childDef.id || childDef.type + "_" + seen.size;
      seen.add(cid);
      const renderer = OVERLAY_RENDERERS[childDef.type];
      if (!renderer) continue;
      if (!existing[cid]) {
        const mesh = renderer.create(childDef);
        mesh.userData.overlayId = cid;
        group.add(mesh);
        existing[cid] = { mesh, def: childDef, type: childDef.type };
      } else {
        const entry = existing[cid];
        if (entry.type === childDef.type) {
          renderer.update(entry.mesh, childDef);
        }
      }
    }
    for (const cid in existing) {
      if (!seen.has(cid)) {
        group.remove(existing[cid].mesh);
        disposeMesh(existing[cid].mesh);
        delete existing[cid];
      }
    }
    group.userData.childMeshes = existing;
  }

  const overlayMeshes = {};

  function syncOverlays(overlays) {
    const seen = new Set();
    for (const o of overlays) {
      const id = o.id;
      if (!id) continue;
      seen.add(id);
      const renderer = OVERLAY_RENDERERS[o.type];
      if (!renderer) continue;
      if (!overlayMeshes[id]) {
        const mesh = renderer.create(o);
        mesh.userData.overlayId = id;
        worldGroup.add(mesh);
        overlayMeshes[id] = { mesh, type: o.type };
      } else if (overlayMeshes[id].type === o.type) {
        renderer.update(overlayMeshes[id].mesh, o);
      }
    }
    for (const id in overlayMeshes) {
      if (!seen.has(id)) {
        worldGroup.remove(overlayMeshes[id].mesh);
        disposeMesh(overlayMeshes[id].mesh);
        delete overlayMeshes[id];
      }
    }
  }

  window.toggleOverlays = function () {
    const show = document.getElementById("show-overlays").checked;
    for (const id in overlayMeshes) {
      overlayMeshes[id].mesh.visible = show;
    }
  };

  function renderTable(objects, overlays) {
    const tbody = document.getElementById("obj-tbody");
    let rows = "";
    for (const o of objects) {
      const nk =
        o.num_keypoints || (o.keypoints_3d ? o.keypoints_3d.length : 0);
      const visType = resolveVisType(o);
      const label =
        visType === "points"
          ? `${nk} pts`
          : visType === "planar"
            ? o.vis_meta && o.vis_meta.tag_id != null
              ? `tag ${o.vis_meta.tag_id}`
              : "planar"
            : "-";
      const selectedCls = selectedId === o.id ? "selected" : "";
      rows += `<tr class="obj-row ${selectedCls}" data-id="${o.id}"><td>${o.id}</td><td>${o.x?.toFixed(2)}</td><td>${o.y?.toFixed(2)}</td><td>${o.z?.toFixed(2)}</td><td>${((o.pitch * 180) / Math.PI)?.toFixed(1)}&deg;</td><td>${((o.yaw * 180) / Math.PI)?.toFixed(1)}&deg;</td><td>${((o.roll * 180) / Math.PI)?.toFixed(1)}&deg;</td><td>${label}</td></tr>`;
    }
    for (const o of overlays) {
      if (!o.id) continue;
      const label = o.label || o.type;
      rows += `<tr class="obj-row" style="color:var(--accent-strong)"><td>${o.id}</td><td>${(o.x || 0).toFixed(2)}</td><td>${(o.y || 0).toFixed(2)}</td><td>${(o.z || 0).toFixed(2)}</td><td>-</td><td>${(((o.yaw || 0) * 180) / Math.PI).toFixed(1)}&deg;</td><td>-</td><td>${label}</td></tr>`;
    }
    tbody.innerHTML =
      rows || '<tr><td colspan="8" class="empty-state">No detections</td></tr>';
  }

  function selectRowById(trackId) {
    // optimistically highlight immediately; the server is the source of truth
    selectedId = trackId;
    fetch("/api/target-selector/select", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ track_id: trackId }),
    }).catch(() => {});
  }

  function clearSelection() {
    selectedId = null;
    fetch("/api/target-selector/clear", { method: "POST" }).catch(() => {});
  }

  document.getElementById("obj-tbody").addEventListener("click", (ev) => {
    const tr = ev.target.closest("tr.obj-row");
    if (!tr) return;
    const id = tr.getAttribute("data-id");
    if (id == null) return;
    selectRowById(Number(id));
  });

  const AXIS_SCALE = VIEWER_CONFIG.scale;

  function setAxisScale(axis, value) {
    const cfg = AXIS_SCALE[axis];
    const v = Math.min(cfg.max, Math.max(cfg.min, value));
    worldGroup.scale[axis] = v;
    const range = document.getElementById(`scale-${axis}-range`);
    const num = document.getElementById(`scale-${axis}-value`);
    range.value = v;
    num.value = v;
  }

  function bindScale(axis) {
    const cfg = AXIS_SCALE[axis];
    const range = document.getElementById(`scale-${axis}-range`);
    const num = document.getElementById(`scale-${axis}-value`);
    for (const input of [range, num]) {
      input.min = cfg.min;
      input.max = cfg.max;
      input.step = cfg.step;
    }
    range.value = cfg.default;
    num.value = cfg.default;
    worldGroup.scale[axis] = cfg.default;
    range.addEventListener("input", () =>
      setAxisScale(axis, parseFloat(range.value)),
    );
    num.addEventListener("change", () => {
      const v = parseFloat(num.value);
      setAxisScale(axis, isFinite(v) ? v : cfg.default);
    });
  }

  ["x", "y", "z"].forEach(bindScale);
  document.getElementById("scale-reset").addEventListener("click", () => {
    ["x", "y", "z"].forEach((a) => setAxisScale(a, AXIS_SCALE[a].default));
  });

  async function poll() {
    try {
      const [detRes, ovRes, selRes] = await Promise.all([
        fetch("/api/detections/latest").then((r) => r.json()),
        fetch("/api/overlays").then((r) => r.json()),
        fetch("/api/target-selector/status")
          .then((r) => r.json())
          .catch(() => ({ selected_id: null })),
      ]);
      const objects = detRes.objects || [];
      const overlays = ovRes.overlays || [];
      if (selRes && typeof selRes.selected_id !== "undefined") {
        selectedId = selRes.selected_id;
      }
      syncDetections(objects);
      syncOverlays(overlays);
      renderTable(objects, overlays);
    } catch (_) {}
  }
  ispyPoll(poll, 200);

  window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    updateFatRes();
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>
{% endblock %}
