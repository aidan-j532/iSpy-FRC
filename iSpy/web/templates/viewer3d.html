{% extends "base.html" %}
{% block title %}3D Viewer - iSpy{% endblock %}
{% block head %}
<style>
#scene-container { width:100%; height:65vh; background:#0a0a0f; border-radius:var(--radius); position:relative; overflow:hidden; }
#scene-container canvas { display:block; }
.viewer-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.viewer-toolbar label { color:var(--text-dim); font-size:0.85rem; display:flex; align-items:center; gap:6px; }
.viewer-toolbar select { background:var(--bg); color:var(--text); border:1px solid var(--border); padding:4px 8px; border-radius:var(--radius); }
#object-list { max-height:200px; overflow-y:auto; }
#object-list table { width:100%; }
.obj-row td { font-size:0.82rem; }
</style>
{% endblock %}
{% block content %}
<h1>3D Detection Viewer</h1>
<div class="viewer-toolbar">
  <label>Camera
    <select id="view-preset" onchange="setViewPreset()">
      <option value="default">Default</option>
      <option value="top">Top-down</option>
      <option value="front">Front</option>
      <option value="side">Side</option>
    </select>
  </label>
  <label style="margin-left:auto;">
    <input type="checkbox" id="show-grid" checked onchange="toggleGrid()"> Grid
  </label>
  <label>
    <input type="checkbox" id="show-axes" checked onchange="toggleAxes()"> Axes
  </label>
  <label>
    <input type="checkbox" id="light-bg" onchange="toggleLightBg()"> White BG
  </label>
  <label>
    <input type="checkbox" id="show-overlays" checked onchange="toggleOverlays()"> Overlays
  </label>
</div>
<div id="scene-container"></div>
<div class="card" style="margin-top:12px;">
  <h3>Detections &amp; Overlays</h3>
  <div id="object-list">
    <table>
      <thead><tr><th>ID</th><th>X</th><th>Y</th><th>Z</th><th>Pitch</th><th>Yaw</th><th>Roll</th><th>Vis</th></tr></thead>
      <tbody id="obj-tbody"></tbody>
    </table>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 200);
camera.position.set(0, 8, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.update();

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);
const hemiLight = new THREE.HemisphereLight(0x4c8bf5, 0x111318, 0.3);
scene.add(hemiLight);

const gridHelper = new THREE.GridHelper(20, 80, 0x2a2e38, 0x1a1d24);
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(8);
scene.add(axesHelper);

window.toggleGrid = function() {
  gridHelper.visible = document.getElementById('show-grid').checked;
};
window.toggleAxes = function() {
  axesHelper.visible = document.getElementById('show-axes').checked;
};
let lightBg = false;
window.toggleLightBg = function() {
  lightBg = document.getElementById('light-bg').checked;
  if (lightBg) {
    scene.background = new THREE.Color(0xf0f0f0);
    scene.fog = null;
    gridHelper.material.color.set(0x888888);
    gridHelper.material.color2.set(0xcccccc);
    container.style.background = '#f0f0f0';
  } else {
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);
    gridHelper.material.color.set(0x2a2e38);
    gridHelper.material.color2.set(0x1a1d24);
    container.style.background = '#0a0a0f';
  }
};

const PRESETS = {
  default: { pos: [0, 8, 14], target: [0, 0, 0] },
  top: { pos: [0, 22, 0.01], target: [0, 0, 0] },
  front: { pos: [0, 2, 18], target: [0, 0, 0] },
  side: { pos: [18, 2, 0], target: [0, 0, 0] },
};
window.setViewPreset = function() {
  const p = PRESETS[document.getElementById('view-preset').value] || PRESETS.default;
  camera.position.set(...p.pos);
  controls.target.set(...p.target);
  controls.update();
};

// --- constants ---
const GRID_UNIT = 0.25;
const CUBE_SIZE = 0.25;
const DOT_RADIUS = 0.05;
const BOX_COLOR = 0x4c8bf5;

// --- helpers ---
function disposeMesh(obj) {
  if (obj.geometry) obj.geometry.dispose();
  if (obj.material) {
    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
    else obj.material.dispose();
  }
  if (obj.children) {
    for (const c of obj.children.slice()) disposeMesh(c);
  }
}

function toViewer(px, py, pz) {
  return new THREE.Vector3(px, pz, py);
}

// ============================================================
// Detection renderers (existing -- renders vision detections)
// ============================================================

function makeCubeMarker() {
  const geo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
  const mat = new THREE.MeshStandardMaterial({ color: BOX_COLOR, transparent: true, opacity: 0.85 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  const wireGeo = new THREE.EdgesGeometry(geo);
  const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
  mesh.add(new THREE.LineSegments(wireGeo, wireMat));
  return mesh;
}

function updateCubeMarker(mesh, o) {
  mesh.position.copy(toViewer(o.x, o.y, o.z));
  mesh.rotation.set(o.roll, o.yaw, o.pitch);
}

function makePlanarMarker(o) {
  const g = new THREE.Group();
  const size = Math.max(0.02, (o.vis_meta && o.vis_meta.size) || GRID_UNIT);
  const planeGeo = new THREE.PlaneGeometry(size, size);
  const planeMat = new THREE.MeshStandardMaterial({
    color: 0xffaa00, transparent: true, opacity: 0.75, side: THREE.DoubleSide,
  });
  g.add(new THREE.Mesh(planeGeo, planeMat));
  g.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(planeGeo),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }),
  ));
  g.add(new THREE.AxesHelper(size * 0.6));
  g.userData.planarSize = size;
  return g;
}

function updatePlanarMarker(g, o) {
  g.position.copy(toViewer(o.x, o.y, o.z));
  g.rotation.set(o.roll, o.yaw, o.pitch);
  const size = Math.max(0.02, (o.vis_meta && o.vis_meta.size) || GRID_UNIT);
  g.scale.setScalar(size / (g.userData.planarSize || size));
}

function buildPointCloud(kpts3d) {
  const g = new THREE.Group();
  const pts = kpts3d.map(k => toViewer(k[0], k[1], k[2]));
  const dotGeo = new THREE.SphereGeometry(DOT_RADIUS, 12, 12);
  const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
  for (const p of pts) {
    const m = new THREE.Mesh(dotGeo, dotMat);
    m.position.copy(p);
    g.add(m);
  }
  g.userData.dotRadius = DOT_RADIUS;
  return g;
}

function updatePointCloud(g, kpts3d) {
  const pts = kpts3d.map(k => toViewer(k[0], k[1], k[2]));
  while (g.children.length < pts.length) {
    const dotGeo = new THREE.SphereGeometry(g.userData.dotRadius || DOT_RADIUS, 12, 12);
    const dotMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
    g.add(new THREE.Mesh(dotGeo, dotMat));
  }
  while (g.children.length > pts.length) {
    const extra = g.children.pop();
    disposeMesh(extra);
  }
  for (let i = 0; i < pts.length; i++) {
    g.children[i].position.copy(pts[i]);
  }
}

const VIS_RENDERERS = {
  generic: { create: () => makeCubeMarker(),     update: updateCubeMarker },
  points:  { create: (o) => buildPointCloud(o.keypoints_3d),
             update: (g, o) => updatePointCloud(g, o.keypoints_3d) },
  planar:  { create: (o) => makePlanarMarker(o), update: updatePlanarMarker },
};

function resolveVisType(o) {
  const hasKp = o.keypoints_3d && o.keypoints_3d.length >= 3;
  if (hasKp) return "points";
  if (o.vis_type && VIS_RENDERERS[o.vis_type]) return o.vis_type;
  return "generic";
}

// detection sync
const boxes = {};

function createBoxForDetection(o) {
  const key = o.id;
  const visType = resolveVisType(o);
  const prev = boxes[key];
  if (prev) {
    if (prev.userData.visType === visType) return prev;
    cleanupBox(key);
  }
  const renderer = VIS_RENDERERS[visType] || VIS_RENDERERS.generic;
  const obj3d = renderer.create(o);
  obj3d.userData.visType = visType;
  scene.add(obj3d);
  return obj3d;
}

function updateExistingBox(obj3d, o) {
  const visType = obj3d.userData.visType || "generic";
  const renderer = VIS_RENDERERS[visType] || VIS_RENDERERS.generic;
  renderer.update(obj3d, o);
}

function cleanupBox(key) {
  const obj = boxes[key];
  if (!obj) return;
  scene.remove(obj);
  disposeMesh(obj);
  delete boxes[key];
}

function syncDetections(objects) {
  const seen = new Set();
  for (const o of objects) {
    seen.add(o.id);
    const key = o.id;
    const visType = resolveVisType(o);
    if (!boxes[key]) {
      boxes[key] = createBoxForDetection(o);
    } else if (boxes[key].userData.visType !== visType) {
      boxes[key] = createBoxForDetection(o);
    } else {
      updateExistingBox(boxes[key], o);
    }
  }
  for (const k in boxes) {
    const idNum = parseInt(k, 10);
    if (!isNaN(idNum) && !seen.has(idNum)) {
      cleanupBox(k);
    }
  }
}

// ============================================================
// Overlay renderers (generic -- any add-on can push overlays)
//
// Each renderer is a { create(overlay), update(mesh, overlay) }
// pair keyed by the overlay's "type" field.  Add-ons push
// overlay dicts via Viewer3DModule.add_overlay(); the frontend
// renders them through this registry.
// ============================================================

function parseColor(hex, fallback) {
  if (!hex) return fallback;
  try { return parseInt(hex.replace('#', ''), 16); } catch { return fallback; }
}

const OVERLAY_RENDERERS = {
  box: {
    create(o) {
      const d = o.data || {};
      const w = d.width || 0.5, h = d.height || 0.5, dep = d.depth || 0.5;
      const geo = new THREE.BoxGeometry(w, h, dep);
      const col = parseColor(o.color, 0x4c8bf5);
      const mat = new THREE.MeshStandardMaterial({ color: col, transparent: true, opacity: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      const wireGeo = new THREE.EdgesGeometry(geo);
      const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
      mesh.add(new THREE.LineSegments(wireGeo, wireMat));
      return mesh;
    },
    update(mesh, o) {
      mesh.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
      mesh.rotation.set(o.roll || 0, o.yaw || 0, o.pitch || 0);
    },
  },

  sphere: {
    create(o) {
      const d = o.data || {};
      const r = d.radius || 0.25;
      const geo = new THREE.SphereGeometry(r, 20, 20);
      const col = parseColor(o.color, 0x4caf50);
      const mat = new THREE.MeshStandardMaterial({ color: col, transparent: true, opacity: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      return mesh;
    },
    update(mesh, o) {
      mesh.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
      mesh.rotation.set(o.roll || 0, o.yaw || 0, o.pitch || 0);
    },
  },

  group: {
    create(o) {
      const g = new THREE.Group();
      g.userData.overlayDef = o;
      return g;
    },
    update(g, o) {
      g.position.copy(toViewer(o.x || 0, o.y || 0, o.z || 0));
      g.rotation.set(o.roll || 0, o.yaw || 0, o.pitch || 0);
      const children = (o.data && o.data.children) || [];
      syncOverlayChildren(g, children);
    },
  },
};

function syncOverlayChildren(group, childrenDef) {
  const existing = group.userData.childMeshes || {};
  const seen = new Set();
  for (const childDef of childrenDef) {
    const cid = childDef.id || (childDef.type + '_' + seen.size);
    seen.add(cid);
    const renderer = OVERLAY_RENDERERS[childDef.type];
    if (!renderer) continue;
    if (!existing[cid]) {
      const mesh = renderer.create(childDef);
      mesh.userData.overlayId = cid;
      group.add(mesh);
      existing[cid] = { mesh, def: childDef, type: childDef.type };
    } else {
      const entry = existing[cid];
      if (entry.type === childDef.type) {
        renderer.update(entry.mesh, childDef);
      }
    }
  }
  for (const cid in existing) {
    if (!seen.has(cid)) {
      group.remove(existing[cid].mesh);
      disposeMesh(existing[cid].mesh);
      delete existing[cid];
    }
  }
  group.userData.childMeshes = existing;
}

// overlay sync
const overlayMeshes = {};

function syncOverlays(overlays) {
  const seen = new Set();
  for (const o of overlays) {
    const id = o.id;
    if (!id) continue;
    seen.add(id);
    const renderer = OVERLAY_RENDERERS[o.type];
    if (!renderer) continue;
    if (!overlayMeshes[id]) {
      const mesh = renderer.create(o);
      mesh.userData.overlayId = id;
      scene.add(mesh);
      overlayMeshes[id] = { mesh, type: o.type };
    } else if (overlayMeshes[id].type === o.type) {
      renderer.update(overlayMeshes[id].mesh, o);
    }
  }
  for (const id in overlayMeshes) {
    if (!seen.has(id)) {
      scene.remove(overlayMeshes[id].mesh);
      disposeMesh(overlayMeshes[id].mesh);
      delete overlayMeshes[id];
    }
  }
}

window.toggleOverlays = function() {
  const show = document.getElementById('show-overlays').checked;
  for (const id in overlayMeshes) {
    overlayMeshes[id].mesh.visible = show;
  }
};

// ============================================================
// Table rendering
// ============================================================

function renderTable(objects, overlays) {
  const tbody = document.getElementById('obj-tbody');
  let rows = '';
  for (const o of objects) {
    const nk = o.num_keypoints || (o.keypoints_3d ? o.keypoints_3d.length : 0);
    const visType = resolveVisType(o);
    const label = visType === 'points' ? `${nk} pts`
                : visType === 'planar' ? (o.vis_meta && o.vis_meta.tag_id != null ? `tag ${o.vis_meta.tag_id}` : 'planar')
                : '-';
    rows += `<tr class="obj-row"><td>${o.id}</td><td>${o.x?.toFixed(2)}</td><td>${o.y?.toFixed(2)}</td><td>${o.z?.toFixed(2)}</td><td>${(o.pitch * 180 / Math.PI)?.toFixed(1)}&deg;</td><td>${(o.yaw * 180 / Math.PI)?.toFixed(1)}&deg;</td><td>${(o.roll * 180 / Math.PI)?.toFixed(1)}&deg;</td><td>${label}</td></tr>`;
  }
  for (const o of overlays) {
    if (!o.id) continue;
    const label = o.label || o.type;
    rows += `<tr class="obj-row" style="color:#4c8bf5"><td>${o.id}</td><td>${(o.x||0).toFixed(2)}</td><td>${(o.y||0).toFixed(2)}</td><td>${(o.z||0).toFixed(2)}</td><td>-</td><td>${((o.yaw||0) * 180 / Math.PI).toFixed(1)}&deg;</td><td>-</td><td>${label}</td></tr>`;
  }
  tbody.innerHTML = rows || '<tr><td colspan="8" class="empty-state">No detections</td></tr>';
}

// ============================================================
// Poll & animate
// ============================================================

async function poll() {
  try {
    const [detRes, ovRes] = await Promise.all([
      fetch('/api/detections/latest').then(r => r.json()),
      fetch('/api/overlays').then(r => r.json()),
    ]);
    const objects = detRes.objects || [];
    const overlays = ovRes.overlays || [];
    syncDetections(objects);
    syncOverlays(overlays);
    renderTable(objects, overlays);
  } catch (_) {}
}
setInterval(poll, 200);

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
{% endblock %}
