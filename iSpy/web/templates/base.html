<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}iSpy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="ispy-nav">
        <div class="ispy-nav-brand">
            <span class="ispy-nav-dot"></span> iSpy
        </div>
        <div class="ispy-nav-links">
            <a href="/status" class="{{ 'active' if active_page == 'status' else '' }}">Status</a>
            <a href="/cameras" class="{{ 'active' if active_page == 'cameras' else '' }}">Cameras</a>
            <a href="/models" class="{{ 'active' if active_page == 'models' else '' }}">Models</a>
            <a href="/settings" class="{{ 'active' if active_page == 'settings' else '' }}">Settings</a>
        </div>
    </nav>

    <main class="ispy-main">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/live.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
