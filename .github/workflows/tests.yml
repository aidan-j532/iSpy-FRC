name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you trigger it manually from GitHub UI

# a new push to the same branch makes the in-flight run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 is comfortably inside requires-python (>=3.10) and every
          # native dep (pyntcore/robotpy, onnxruntime) ships cp312 manylinux
          # wheels, so nothing has to build from source.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python (not -headless) links libGL and libglib at import time,
      # so `import cv2` fails on a bare runner. libglib2.0-0 was renamed
      # libglib2.0-0t64 in Ubuntu 24.04 - try the new name, fall back to the old
      # so this keeps working on either runner image.
      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install iSpy
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # torch is a build-time extra ([dev]/[optimizer]), not a runtime dep, but
      # the suite needs it: the .pt fallback path in test_model_select calls
      # ensure_torch_imported(), and the pickle-gadget tests in
      # test_model_upload_security skip without it - that's security coverage
      # worth keeping. CPU wheels only; the rest of [dev] (tensorflow, tensorrt,
      # jupyter) isn't needed to run tests.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pytest
        run: pip install pytest

      # -rs lists skip reasons: the ~14 skips here are tests needing default
      # .pt models, which are downloaded on first use and aren't in the repo.
      - name: Run tests
        run: pytest -q -rs
