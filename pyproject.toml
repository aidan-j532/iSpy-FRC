[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ispy-frc"
version = "2.2.15"
description = "FRC vision pipeline for custom, hardware accelerated object detection."
readme = "readme.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]

authors = [
    { name = "iSpy FRC Author Team", email = "aidanrjensen@gmail.com" }
]

maintainers = [
    { name = "iSpy FRC Maintainer", email = "aidanrjensen@gmail.com" }
]


dependencies = [
    # NumPy: keep ARM64 on NumPy 1.x for compatibility
    "numpy>=1.26.0,<2; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "numpy>=1.26.0; platform_system != 'Linux' or platform_machine != 'aarch64'",

    # OpenCV: versions 4.12+ require NumPy 2 on relevant Python builds
    "opencv-python>=4.8.0,<4.12; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "opencv-python>=4.8.0; platform_system != 'Linux' or platform_machine != 'aarch64'",

    # Protobuf: preserve older compatibility on ARM64
    "protobuf>=3.20.2,<4; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "protobuf>=3.20.2; platform_system != 'Linux' or platform_machine != 'aarch64'",

    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "psutil>=7.2.0",
    "ruamel.yaml>=0.19.0",
    "Pillow>=12.0.0",
    "flask>=3.0",
    "scikit-learn>=1.3.0",
    "pyntcore>=2026.0.0,<2027.0.0",
    "robotpy>=2026.0.0,<2027.0.0",
    "robotpy[apriltag]>=2026.0.0,<2027.0.0",
    "plotly>=5.0",
    "onnxruntime>=1.16.0",
    "transformers",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "PyYAML>=6.0",
    "Werkzeug>=3.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
# For model training, conversion, and development - x86 only.
# pip install ".[dev]"   (install-dev.sh handles the rknn-toolkit2 --find-links)
dev = [
    "torchvision>=0.15.0",  # only for training/conversion scripts
    "tensorflow>=2.13.0",
    "onnx>=1.16.0,<1.17",
    "onnxslim>=0.1.87",
    "matplotlib>=3.8.0",
    "polars>=1.39.0",
    "snakeviz",
    "jupyter",
    "tensorboard",
    "tensorrt>=10.0.0",
    "matplotlib>=3.8.0"
]

optimizer = [
    "ultralytics>=8.3.0",
    "onnx>=1.16.0,<1.17",
    "onnxslim>=0.1.87",
]

[project.scripts]
ispy = "iSpy.cli:main"
ispy-run  = "iSpy.core.game_loop:main"
ispy-boot = "iSpy.boot.boot:main"
ispy-bench = "iSpy.validations.benchmarking:main"
ispy-stats = "iSpy.validations.tests.compare_models:main"

[project.urls]
Homepage = "https://github.com/aidan-j532/iSpy-FRC"
Repository = "https://github.com/aidan-j532/iSpy-FRC"
Bug-Tracker = "https://github.com/aidan-j532/iSpy-FRC/issues"

[tool.setuptools.packages.find]
include = ["iSpy", "iSpy.*"]

[tool.setuptools.package-data]
"iSpy" = ["assets/*", "rknn_wheels/*.whl"]