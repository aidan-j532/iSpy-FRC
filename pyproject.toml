[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ispy-frc"
version = "1.2.15"
description = "FRC vision pipeline for custom, hardware accelerated object detection."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }

authors = [
    { name = "iSpy FRC Author Team", email = "aidanrjensen@gmail.com" }
]

maintainers = [
    { name = "iSpy FRC Maintainer", email = "aidanrjensen@gmail.com" }
]

# Universal deps - install cleanly on every platform (Orange Pi, RPi, x86, Mac, Windows).
# Hardware-specific backends (RKNN, TensorRT, OpenVINO, TFLite, CoreML) are NOT listed here.
# boot.py detects the hardware at runtime and pip-installs whatever is needed automatically.
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "protobuf>=3.20.2",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "psutil>=7.2.0",
    "ruamel.yaml>=0.19.0",
    "Pillow>=12.0.0",
    "flask>=3.0",
    "scikit-learn>=1.3.0",
    "pyntcore>=2024.0.0",
    "robotpy>=2024.0.0",
    "plotly>=5.0",
    "onnxruntime>=1.16.0",  # CPU ONNX fallback - works everywhere, used until boot picks a better backend
    "transformers",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# For model training, conversion, and development - x86 only.
# pip install ".[dev]"   (install-dev.sh handles the rknn-toolkit2 --find-links)
dev = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tensorflow>=2.13.0",
    "onnx>=1.16.0,<1.17",
    "onnxslim>=0.1.87",
    "matplotlib>=3.8.0",
    "polars>=1.39.0",
    "snakeviz",
    "jupyter",
    "tensorboard",
    "tensorrt>=10.0.0"
]

# Build-time model export / YOLO-World reparameterization tooling.
# These steps shell out to Ultralytics (AGPL-3.0) to produce build artifacts
# (ONNX/TensorRT/RKNN/etc. and class-baked .pt files) that the runtime then
# consumes via the on-device loader (iSpy.vision.yolo_pt) - Ultralytics is
# NEVER needed for iSpy runtime inference. Install only in a build env:
#   pip install ".[optimizer]"
optimizer = [
    "ultralytics>=8.3.0",
    "onnx>=1.16.0,<1.17",
    "onnxslim>=0.1.87",
]

[project.scripts]
ispy = "iSpy.cli:main"
ispy-run  = "iSpy.core.game_loop:main"
ispy-boot = "iSpy.boot.boot:main"
ispy-bench = "iSpy.validations.benchmarking:main"
ispy-stats = "iSpy.validations.tests.compare_models:main"
ispy-test-web = "iSpy.web.test_web:main"

[project.urls]
Homepage = "https://github.com/aidan-j532/iSpy-FRC"
Repository = "https://github.com/aidan-j532/iSpy-FRC"
Bug-Tracker = "https://github.com/aidan-j532/iSpy-FRC/issues"

[tool.setuptools.packages.find]
include = ["iSpy", "iSpy.*"]

[tool.setuptools.package-data]
"iSpy" = ["assets/*", "rknn_wheels/*.whl"]